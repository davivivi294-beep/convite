<title>Aniversário do Davi – 15 anos</title>
<style>
:root{--bg1:#0a2a6b;--bg2:#1e6fe0;--gold:#cfe8ff;--text:#ffffff;--muted:#d6e8ff;--card:rgba(255,255,255,.14);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}
html,body{margin:0}
body{min-height:100vh;background:radial-gradient(circle at 20% 0%,var(--bg2),var(--bg1) 70%);color:var(--text);font-family:Georgia,"Times New Roman",serif;display:flex;justify-content:center;padding:28px 16px}
.wrap{width:100%;max-width:420px;text-align:center}
.tag{letter-spacing:.35em;font-size:12px;color:var(--gold);text-transform:uppercase;font-family:system-ui,sans-serif}
.num{font-size:150px;line-height:1;margin:8px 0 0;font-weight:700;background:linear-gradient(180deg,#ffffff,#9fd0ff);-webkit-background-clip:text;background-clip:text;color:transparent}
.anos{font-size:22px;letter-spacing:.3em;text-transform:uppercase;margin-top:-6px}
h1{font-weight:400;font-size:20px;margin:22px 0 4px;color:var(--muted)}
.nome{font-size:44px;font-style:italic;margin:0 0 20px;color:var(--gold)}
.line{height:1px;background:linear-gradient(90deg,transparent,var(--gold),transparent);margin:18px 0}
.info{display:grid;grid-template-columns:1fr 1fr;gap:10px;font-family:system-ui,sans-serif}
.box{background:var(--card);border:1px solid rgba(255,255,255,.4);border-radius:14px;padding:14px 8px}
.box small{display:block;font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--muted);margin-bottom:6px}
.box b{font-size:16px;font-weight:600}
.gift{margin-top:22px;background:var(--card);border:1px solid rgba(255,255,255,.4);border-radius:18px;padding:20px 16px;font-family:system-ui,sans-serif}
.gift h2{font-family:Georgia,serif;font-weight:400;font-size:22px;margin:0 0 8px;color:var(--gold)}
.gift p{margin:0 0 14px;color:var(--muted);font-size:14px;line-height:1.5}
.qr{background:#fff;padding:10px;border-radius:12px;display:inline-block}
.qr img{width:200px;height:200px;display:block;image-rendering:pixelated}
.key{margin-top:14px;font-size:12px;letter-spacing:.15em;text-transform:uppercase;color:var(--muted)}
.key b{display:block;margin-top:4px;font-size:20px;letter-spacing:.05em;color:var(--text);user-select:all}
.foot{margin-top:22px;font-size:14px;color:var(--muted);font-family:system-ui,sans-serif}
.wrap{position:relative;z-index:1}
@keyframes up{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:none}}
@keyframes pop{0%{opacity:0;transform:scale(.3) rotate(-8deg)}70%{transform:scale(1.12) rotate(2deg)}100%{opacity:1;transform:none}}
@keyframes float{50%{transform:translateY(-10px)}}
@keyframes fall{from{transform:translateY(-8vh) rotate(0)}to{transform:translateY(112vh) rotate(600deg)}}
@keyframes glow{50%{box-shadow:0 0 22px rgba(255,255,255,.55)}}
.tag{animation:up .8s both}
.num{animation:pop 1s .2s both;will-change:transform}
.anos{animation:up .8s .5s both}
h1{animation:up .8s .7s both}
.nome{animation:pop .9s .9s both}
.info{animation:up .8s 1.2s both}
.gift{animation:up .8s 1.5s both}
.foot{animation:up .8s 1.8s both}
@keyframes rise{from{transform:translateY(0)}to{transform:translateY(-120vh)}}
.ball{will-change:transform;position:fixed;bottom:-70px;font-size:36px;pointer-events:none;z-index:0;animation:rise linear infinite}
.confetti{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:0}
.confetti i:nth-child(even){display:none}
.ball:nth-of-type(n+3){display:none}
.confetti i{will-change:transform;position:absolute;top:0;width:8px;height:14px;border-radius:2px;opacity:.85;animation:fall linear infinite}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
